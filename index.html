<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday for Sha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🌸 FLOATING FLOWERS -->
<div class="flower-bg" style="left:10%; animation-duration:6s;"></div>
<div class="flower-bg" style="left:30%; animation-duration:8s;"></div>
<div class="flower-bg" style="left:50%; animation-duration:7s;"></div>
<div class="flower-bg" style="left:70%; animation-duration:9s;"></div>
<div class="flower-bg" style="left:90%; animation-duration:6.5s;"></div>

<!-- 🎀 START SCREEN -->
<div class="start" id="start">

  <div class="flower-sticker"></div>

  <h2 class="title">A SURPRISE FOR SHA </h2>

  <button class="cute-btn" onclick="showEnvelope()">
    Open Me
  </button>

</div>

<!-- 💜 ENVELOPE -->
<div class="envelope-container" id="envelopeContainer">
  <div class="envelope" onclick="openEnvelope()">
    <div class="flap"></div>
    <div class="frontText">Tap Me</div>
  </div>
</div>

<!-- 💌 LETTER -->
<div class="card" id="card">

  <h1 class="title-big">Happy Birthday Sha!</h1>

  <p class="letter">
    Dear Sha,<br><br>
    Wishing you a soft, beautiful birthday filled with love, peace, and happiness.  
    You are truly special and deserve everything gentle and kind in this world 💜🌸
  </p>

  <!-- 🖼️ COQUETTE IMAGE GALLERY -->
  <div class="gallery">

    <div class="photo-frame">
      <img src="pic1.jpg">
    </div>

    <div class="photo-frame">
      <img src="pic2.jpg">
    </div>

    <div class="photo-frame">
      <img src="pic3.jpg">
    </div>

  </div>

  <div class="bouquet"></div>

  <button class="love-btn" onclick="showBalloons()">
    Send Love
  </button>

</div>

<!-- 🎈 balloons -->
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>

<script>
function showEnvelope(){
  document.getElementById("start").style.display="none";
  document.getElementById("envelopeContainer").style.display="flex";
}

function openEnvelope(){
  document.querySelector(".envelope").classList.add("open");

  setTimeout(()=>{
    document.getElementById("envelopeContainer").style.display="none";
    document.getElementById("card").style.display="block";
  },1200);
}

function showBalloons(){
  document.querySelectorAll(".balloon").forEach(b=>{
    b.style.animation="float 3s ease-in forwards";
  });
}
</script>

</body>
</html>
